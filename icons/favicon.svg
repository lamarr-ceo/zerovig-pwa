<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <radialGradient id="bgObsidian" cx="50%" cy="38%" r="70%" fx="50%" fy="38%">
      <stop offset="0%" stop-color="#0E1914"/>
      <stop offset="55%" stop-color="#06090C"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="rimBorder" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#00E676" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="vigGreenGrad" x1="512" y1="220" x2="880" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19FF8C"/>
      <stop offset="55%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <linearGradient id="horizonBarGrad" x1="140" y1="790" x2="884" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="46%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#00E676" flood-opacity="0.38"/>
    </filter>
    <filter id="whiteShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Full-bleed Obsidian Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgObsidian)"/>

  <!-- Inner Precision Rim -->
  <rect x="22" y="22" width="980" height="980" rx="204" fill="none" stroke="url(#rimBorder)" stroke-width="8"/>

  <!-- ULTRA-HEAVY BLOCK 'Z' (Pure Crisp White #FFFFFF, Archivo Black Slab Proportions) -->
  <g filter="url(#whiteShadow)">
    <path d="M 124 252 H 516 V 364 L 288 608 H 504 L 468 724 H 116 V 612 L 344 368 H 124 Z" fill="#FFFFFF"/>
  </g>

  <!-- ULTRA-HEAVY BLOCK 'V' (Electric Green #00E676, Matched Slab Thickness + Upward Apex Cut) -->
  <g filter="url(#greenGlow)">
    <path d="M 488 252 H 628 L 702 544 L 778 252 H 914 L 768 724 H 632 Z" fill="url(#vigGreenGrad)"/>
    <!-- Subtle upward edge notch on the top-right terminal of V -->
    <polygon points="846,204 934,204 914,252 826,252" fill="#00E676"/>
  </g>

  <!-- SIGNATURE ZEROVIG HORIZON BAR (Matches the Solo Wordmark Header Bottom Glow) -->
  <g filter="url(#greenGlow)">
    <rect x="116" y="782" width="798" height="28" rx="14" fill="url(#horizonBarGrad)"/>
  </g>
</svg>
